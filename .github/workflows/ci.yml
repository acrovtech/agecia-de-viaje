name: CI & P2.8 Security Gates

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: travel_integration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test_user -d travel_integration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test_user:test_password@127.0.0.1:5432/travel_integration_test
      DIRECT_URL: postgresql://test_user:test_password@127.0.0.1:5432/travel_integration_test
      TEST_DATABASE_URL: postgresql://test_user:test_password@127.0.0.1:5432/travel_integration_test
      ALLOW_POSTGRES_INTEGRATION_TESTS: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 12.0.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma Schema
        run: pnpm --filter @repo/db exec prisma validate

      - name: Check Types (Admin)
        run: pnpm --filter admin check-types

      - name: Check Types (API)
        run: pnpm --filter api check-types

      - name: Check Types (Web)
        run: pnpm --filter web check-types

      - name: Build API
        run: pnpm --filter api build

      - name: Run Vitest Unit Tests
        run: pnpm vitest run

      - name: Run Platform Control Plane E2E
        run: node --test apps/api/test/platform-control-plane.e2e.mjs

      - name: Run Safety Guard Unit Tests
        run: node --test apps/api/test/postgres-concurrency-safety.test.mjs

      - name: Build Admin (API auth mode)
        run: ADMIN_AUTH_MODE=api pnpm --filter admin build

      - name: Deploy Migrations to Ephemeral Postgres
        run: pnpm --filter @repo/db exec prisma migrate deploy

      - name: Run PostgreSQL Concurrency Integration Gate
        run: node --test apps/api/test/branding-concurrency.postgres.e2e.mjs
