name: CI & P2.8 Security Gates

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: api_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d api_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/api_test_ci
      DIRECT_URL: postgresql://test:test@127.0.0.1:5432/api_test_ci
      TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/api_test_ci
      API_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/api_test_ci
      ALLOW_POSTGRES_INTEGRATION_TESTS: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@12.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma Schema
        run: pnpm --filter @repo/db exec prisma validate

      - name: Deploy Migrations to Ephemeral Postgres
        run: pnpm --filter @repo/db exec prisma migrate deploy

      - name: Check Types (Admin)
        run: pnpm --filter admin check-types

      - name: Check Types (API)
        run: pnpm --filter api check-types

      - name: Check Types (Web)
        run: pnpm --filter web check-types

      - name: Lint API
        run: pnpm --filter api lint

      - name: Build API
        run: pnpm --filter api build

      - name: Build Web
        run: pnpm --filter web build

      - name: Build Admin (API auth mode)
        run: ADMIN_AUTH_MODE=api pnpm --filter admin build

      - name: Run Vitest Unit Tests
        run: pnpm vitest run

      - name: Run API E2E Regression Suite
        run: pnpm --filter api test

      - name: Run PostgreSQL Integration Suite
        run: |
          if ! pnpm --filter api test:integration > integration_output.txt 2>&1; then
            cat integration_output.txt
            ERR_MSG=$(grep -B 3 -A 25 "not ok" integration_output.txt | tr '\r\n' '  ' | head -c 1000)
            if [ -z "$ERR_MSG" ]; then
              ERR_MSG=$(tail -n 30 integration_output.txt | tr '\r\n' '  ' | head -c 1000)
            fi
            echo "::error title=Postgres Integration Failure::$ERR_MSG"
            exit 1
          fi
          cat integration_output.txt

      - name: Run Runtime Smoke Suite
        run: node --test apps/api/test/runtime-smoke.e2e.mjs

      - name: Run Concurrency Safety Guard Unit Tests
        run: node --test apps/api/test/postgres-concurrency-safety.test.mjs

      - name: Run PostgreSQL Concurrency Integration Gate
        run: node --test apps/api/test/branding-concurrency.postgres.e2e.mjs
