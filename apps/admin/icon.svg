<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="mountainGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="mountainGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Outer Ring (Navigation / Compass) -->
  <circle cx="100" cy="100" r="92" stroke="url(#goldGrad)" stroke-width="4" fill="url(#bgGrad)" />
  <circle cx="100" cy="100" r="84" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Sun over peaks -->
  <circle cx="100" cy="74" r="22" fill="url(#goldGrad)" />
  <path d="M100 42 L100 48 M100 100 L100 106 M68 74 L74 74 M126 74 L132 74" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Back Mountain Peak -->
  <polygon points="100,52 148,135 52,135" fill="url(#mountainGrad2)" />
  <polygon points="100,52 100,135 148,135" fill="#64748b" opacity="0.4" />
  <polygon points="100,52 118,84 100,78 82,84" fill="#ffffff" />

  <!-- Foreground Mountain Peak -->
  <polygon points="65,78 120,150 10,150" fill="url(#mountainGrad1)" />
  <polygon points="65,78 65,150 120,150" fill="#94a3b8" opacity="0.3" />
  <polygon points="65,78 82,102 65,96 48,102" fill="#ffffff" />

  <!-- Third Right Mountain Peak -->
  <polygon points="135,88 180,150 90,150" fill="url(#mountainGrad1)" />
  <polygon points="135,88 135,150 180,150" fill="#94a3b8" opacity="0.35" />

  <!-- Compass Star Cardinal Indicators -->
  <polygon points="100,12 105,28 100,24 95,28" fill="url(#goldGrad)" />
  <polygon points="100,188 105,172 100,176 95,172" fill="url(#goldGrad)" />
  <polygon points="12,100 28,105 24,100 28,95" fill="url(#goldGrad)" />
  <polygon points="188,100 172,105 176,100 172,95" fill="url(#goldGrad)" />

  <!-- Horizon Arc -->
  <path d="M28 140 Q100 165 172 140" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
</svg>
